<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="title desc"><title id="title">Zwaartekracht · 4. Beoordeel de houd- en valrisico’s</title><desc id="desc">Conceptuele tekening. Controleer de isolatie met de voorgeschreven methode. Een hangende last of een rem alleen is geen veilige werkplek.</desc><style>path:not([fill]){fill:none}</style><rect width="340" height="240" rx="12" fill="#f8f9f4"/><path d="M20 202h300" stroke="#dce2d8"/><g stroke="#7a6590" stroke-width="3.5" fill="#dfe8df" stroke-linecap="round" stroke-linejoin="round"><path d="M38 182V45h190v137M51 58h164m-82 0v25"/><rect x="93" y="84" width="80" height="48" rx="4"/><path d="M133 139v26m-11-12 11 12 11-12" stroke-dasharray="5 5"/><path d="M79 182h108"/><rect x="238" y="70" width="68" height="80" rx="7" fill="#fff"/><rect x="247" y="80" width="50" height="26" rx="3" fill="#e8efdd"/><path d="m251 126 12 12 28-27"/><path d="m239 150-18 21m85-21 13 21"/></g><circle cx="24" cy="25" r="14" fill="#7a6590"/><text x="24" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">4</text><text x="48" y="30" font-family="Arial,sans-serif" font-size="12" fill="#203b33">ZWAARTEKRACHT</text><text x="20" y="225" font-family="Arial,sans-serif" font-size="10" fill="#63716a">Principebeeld · geen installatieschema</text></svg>