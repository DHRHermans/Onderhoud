<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="title desc"><title id="title">Pneumatisch · 5. Laat restdruk beheerst afbouwen</title><desc id="desc">Conceptuele tekening. Beheers eerst mogelijke beweging en lasten. Laat opgesloten lucht via de bedoelde voorzieningen veilig afbouwen en verifieer daarna de veilige toestand. Maak geen koppeling los om te ontluchten.</desc><style>path:not([fill]){fill:none}</style><rect width="340" height="240" rx="12" fill="#f8f9f4"/><path d="M20 202h300" stroke="#dce2d8"/><g stroke="#3d7895" stroke-width="3.5" fill="#dfe8df" stroke-linecap="round" stroke-linejoin="round"><path d="M25 103h55m-28-14 17 14-17 14"/><rect x="81" y="80" width="140" height="72" rx="6"/><path d="M164 85v62m0-31h95M102 101h12m-12 23h12"/><circle cx="49" cy="154" r="13"/><path d="m49 154 7-6"/><path d="M213 167v28m-9-10 9 10 9-10" stroke="#3d7895"/><path d="M227 173q12-10 24 0" stroke-dasharray="3 4"/><path d="M227 177h91l-16-63h-59Z" fill="#e7edd5"/><path d="M250 114V92h45v22m-33 34 9 9 17-18"/><path d="M228 190h91"/></g><circle cx="24" cy="25" r="14" fill="#3d7895"/><text x="24" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">5</text><text x="48" y="30" font-family="Arial,sans-serif" font-size="12" fill="#203b33">PNEUMATISCH</text><text x="20" y="225" font-family="Arial,sans-serif" font-size="10" fill="#63716a">Principebeeld · geen installatieschema</text></svg>