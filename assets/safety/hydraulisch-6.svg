<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="title desc"><title id="title">Hydraulisch · 6. Baken de gevarenzone af</title><desc id="desc">Conceptuele tekening. Bescherm tegen dalende of bewegende delen en mogelijk vrijkomende vloeistof. Zoek een lekkage nooit met de hand; hogedrukinjectie kan ernstig letsel veroorzaken.</desc><style>path:not([fill]){fill:none}</style><rect width="340" height="240" rx="12" fill="#f8f9f4"/><path d="M20 202h300" stroke="#dce2d8"/><g stroke="#a57532" stroke-width="3.5" fill="#dfe8df" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="135" width="65" height="45" rx="5"/><path d="M48 143h49m-23-8V67h78"/><rect x="152" y="55" width="64" height="107" rx="5"/><path d="M158 104h52m-26 0v-67m-48 0h96M216 137h31v42H105"/><circle cx="111" cy="67" r="17"/><path d="m111 67 8-9"/><path d="M232 90v92m76-92v92m-76-80h76m-76 30h76"/><path d="m237 102 16 30m3-30 16 30m3-30 16 30" stroke="#b18239"/><path d="M222 182h20m56 0h20"/></g><circle cx="24" cy="25" r="14" fill="#a57532"/><text x="24" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">6</text><text x="48" y="30" font-family="Arial,sans-serif" font-size="12" fill="#203b33">HYDRAULISCH</text><text x="20" y="225" font-family="Arial,sans-serif" font-size="10" fill="#63716a">Principebeeld · geen installatieschema</text></svg>